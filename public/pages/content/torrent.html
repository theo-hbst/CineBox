        <section>
          <h1>Gestionnaire de téléchargements</h1>
          <form id="test-form" method="POST" enctype="multipart/form-data">
            <div class="form-options">
              <label class="option-label">
                <input type="radio" name="option" value="upload" id="option-upload"> Uploader un fichier
              </label>
              <label class="option-label">
                <input type="radio" name="option" value="magnet" id="option-magnet"> Lien MAGNET
              </label>
            </div>
            
            <div id="upload-zone" class="input-zone" style="display: none;">
              <label class="upload-label">
                <input type="file" name="file_upload" id="file-input" accept="*/*">
                <span class="upload-text">Cliquez pour sélectionner un fichier ou glissez-déposez</span>
              </label>
              <div id="file-info" class="file-info" style="display: none;"></div>
            </div>
            
            <div id="magnet-zone" class="input-zone" style="display: none;">
              <label class="text-label">
                <input type="text" name="text_input" placeholder="Entrez le lien MAGNET" class="text-input">
              </label>
            </div>
            
            <button type="submit" class="submit-btn" disabled>Télécharger</button>
          </form>
        </section>

        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('test-form');
            const uploadOption = document.getElementById('option-upload');
            const magnetOption = document.getElementById('option-magnet');
            const uploadZone = document.getElementById('upload-zone');
            const magnetZone = document.getElementById('magnet-zone');
            const submitBtn = document.querySelector('.submit-btn');
            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const textInput = magnetZone.querySelector('input');

            // Handle option changes
            function updateFormDisplay() {
              if (uploadOption.checked) {
                uploadZone.style.display = 'block';
                magnetZone.style.display = 'none';
                form.action = '/upload_file';
                textInput.value = '';
                checkFormValidity();
              } else if (magnetOption.checked) {
                uploadZone.style.display = 'none';
                magnetZone.style.display = 'block';
                form.action = '/submit_form';
                fileInput.value = '';
                fileInfo.style.display = 'none';
                checkFormValidity();
              } else {
                uploadZone.style.display = 'none';
                magnetZone.style.display = 'none';
                submitBtn.disabled = true;
              }
            }

            function checkFormValidity() {
              if (uploadOption.checked && fileInput.files.length > 0) {
                submitBtn.disabled = false;
              } else if (magnetOption.checked && textInput.value.trim()) {
                submitBtn.disabled = false;
              } else {
                submitBtn.disabled = true;
              }
            }

            uploadOption.addEventListener('change', updateFormDisplay);
            magnetOption.addEventListener('change', updateFormDisplay);

            // File input handling
            fileInput.addEventListener('change', function() {
              const file = this.files[0];
              if (file) {
                fileInfo.innerHTML = `
                  <p><strong>Fichier sélectionné:</strong> ${file.name}</p>
                  <p><strong>Taille:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                `;
                fileInfo.style.display = 'block';
              } else {
                fileInfo.style.display = 'none';
              }
              checkFormValidity();
            });

            // Text input handling
            textInput.addEventListener('input', checkFormValidity);

            // Drag and drop functionality
            const uploadLabel = document.querySelector('.upload-label');
            
            uploadLabel.addEventListener('dragover', function(e) {
              e.preventDefault();
              this.classList.add('drag-over');
            });

            uploadLabel.addEventListener('dragleave', function(e) {
              e.preventDefault();
              this.classList.remove('drag-over');
            });

            uploadLabel.addEventListener('drop', function(e) {
              e.preventDefault();
              this.classList.remove('drag-over');
              const files = e.dataTransfer.files;
              if (files.length > 0) {
                fileInput.files = files;
                fileInput.dispatchEvent(new Event('change'));
              }
            });

            // Form submission handling
            form.addEventListener('submit', function(e) {
              if (uploadOption.checked) {
                if (fileInput.files.length === 0) {
                  e.preventDefault();
                  alert('Veuillez sélectionner un fichier');
                  return;
                }
                // Add hidden input for upload option
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'option';
                hiddenInput.value = 'upload';
                form.appendChild(hiddenInput);
              } else if (magnetOption.checked) {
                if (!textInput.value.trim()) {
                  e.preventDefault();
                  alert('Veuillez entrer un lien MAGNET');
                  return;
                }
                form.action = '/submit_form';
                form.method = 'POST';
                form.enctype = 'application/x-www-form-urlencoded';
              } else {
                e.preventDefault();
                alert('Veuillez sélectionner une option');
                return;
              }
              
              document.cookie = "formSubmitted=true; path=/";
            });

            // Check for success message
            if (document.cookie.split(';').some((item) => item.trim().startsWith('formSubmitted='))) {
              setTimeout(() => {
                if (uploadOption.checked) {
                  alert('Fichier uploadé avec succès!');
                } else {
                  alert('Lien MAGNET ajouté avec succès!');
                }
                document.cookie = "formSubmitted=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
              }, 100);
            }

            const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
            const mobileSidebar = document.getElementById('mobile-sidebar');
            const mobileOverlay = document.getElementById('mobile-overlay');

            function toggleMobileMenu() {
              if (mobileMenuToggle.checked) {
                mobileSidebar.classList.add('open');
                mobileOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
              } else {
                mobileSidebar.classList.remove('open');
                mobileOverlay.classList.remove('open');
                document.body.style.overflow = '';
              }
            }

            mobileMenuToggle.addEventListener('change', toggleMobileMenu);

            // Close sidebar when clicking overlay
            mobileOverlay.addEventListener('click', function() {
              mobileMenuToggle.checked = false;
              toggleMobileMenu();
            });

            // Close sidebar when clicking on a link
            const sidebarLinks = mobileSidebar.querySelectorAll('a');
            sidebarLinks.forEach(link => {
              link.addEventListener('click', function() {
                mobileMenuToggle.checked = false;
                toggleMobileMenu();
              });
            });
          });
        </script>
