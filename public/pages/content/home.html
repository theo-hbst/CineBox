<!doctype html>
<html lang="en" :class="isDark ? 'dark' : 'light'" x-data="{ isDark: true }">

    <div class="flex min-h-screen">

      <!-- Left Sidebar -->

        <!-- Menu -->

          class="mt-12 flex flex-col gap-y-4 text-gray-500 fill-gray-500 text-sm"

          <div class="text-gray-400/70 font-medium uppercase">Menu</div>
          <a

          >

              </g>
            </svg>
            <span>Séries</span>
          </a>

          <a
            class="flex items-center space-x-2 py-1 group hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="movies.html"
          >
            <svg
              class="h-5 w-5 group-hover:fill-red-600"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g>
                <path
                  d="M12 2C6.48 2 2 6.48 2 12c0 5.51 4.48 10 10 10 5.51 0 10-4.49 10-10 0-5.52-4.49-10-10-10Zm0 18c-4.42 0-8-3.59-8-8 0-4.42 3.58-8 8-8 4.41 0 8 3.58 8 8 0 4.41-3.59 8-8 8Z"
                ></path>
                <path d="M8 16l5.991-2 2-6 -6 2Z"></path>
              </g>
            </svg>
            <span>Films</span>
          </a>

          <a
            class="flex items-center space-x-2 py-1 group hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="torrent.html"
          >
            <svg
              class="h-5 w-5 group-hover:fill-red-600"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g>
                <path
                  d="M12 2C6.48 2 2 6.48 2 12c0 5.51 4.48 10 10 10 5.51 0 10-4.49 10-10 0-5.52-4.49-10-10-10Zm0 18c-4.42 0-8-3.59-8-8 0-4.42 3.58-8 8-8 4.41 0 8 3.58 8 8 0 4.41-3.59 8-8 8Z"
                ></path>
                <path d="M13 7h-2v5.414l3.29 3.29 1.41-1.42 -2.71-2.71Z"></path>
              </g>
            </svg>
            <span>Torrents</span>
          </a>

          <a
            class="flex items-center space-x-2 py-1 group hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="filemanager.html"
          >
            <svg
              class="h-5 w-5 group-hover:fill-red-600"

              viewBox="0 0 24 24"

              <g>

                ></path>

              </g>
            </svg>

          </a>

          <div class="mt-8 text-gray-400/70 font-medium uppercase">General</div>
          <a
            class="flex items-center space-x-2 py-1 group hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="profile.html"
          >
            <svg
              class="h-5 w-5 group-hover:fill-red-600"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2v0C9.23 2 7 4.23 7 7c0 2.76 2.23 5 5 5 2.76 0 5-2.24 5-5v0c0-2.77-2.24-5-5-5Zm0 8v0c-1.66 0-3-1.35-3-3 0-1.66 1.34-3 3-3 1.65 0 3 1.34 3 3v0c0 1.65-1.35 3-3 3Zm9 11v-1 0c0-3.87-3.14-7-7-7h-4v0c-3.87 0-7 3.13-7 7v1h2v-1 0c0-2.77 2.23-5 5-5h4v0c2.76 0 5 2.23 5 5v1Z"
              ></path>
            </svg>

          <a
            class="flex items-center space-x-2 py-1 group hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="/public/pages/logged-out.html"
          >
            <svg
              class="h-5 w-5 group-hover:fill-red-600"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g>
                <path d="M16 13v-2H7V8l-5 4 5 4v-3Z"></path>
                <path
                  d="M20 3h-9c-1.11 0-2 .89-2 2v4h2V5h9v14h-9v-4H9v4c0 1.1.89 2 2 2h9c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2Z"
                ></path>
              </g>
            </svg>
            <span>Se déconnecter</span>
          </a>

          <a class="icon-link hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white" href="server.html">
            <img class="icon" src="/public/imgs/server-settings.png" alt="Paramètres du serveur" />
            <span class="icon-text">Serveur</span>

          <div class="text-gray-400/70 font-medium uppercase">Me contacter</div>

          <a
            class="icon-link hover:border-r-4 hover:border-r-red-600 hover:font-semibold dark:hover:text-white"
            href="mailto:theo.herbst.mail@gmail.com"
          >
            <img class="icon" src="/public/imgs/mail.png" alt="Mail" />
            <span class="icon-text">Gmail</span>
          </a>
        </div>
        <!-- /Menu -->
      </aside>
      <!-- /Left Sidebar -->

      <main class="flex-1 py-10 px-5 sm:px-10">
        <header
          class="font-bold text-lg flex items-center gap-x-3 md:hidden mb-12">
          <label class="hamburger">
            <input type="checkbox">
            <svg viewBox="0 0 32 32">
              <path class="line line-top-bottom" d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"></path>
              <path class="line" d="M7 16 27 16"></path>
            </svg>
          </label>
          <svg
            class="h-8 w-8 fill-red-600 shrink-0"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M10 15.5v-7c0-.41.47-.65.8-.4l4.67 3.5c.27.2.27.6 0 .8l-4.67 3.5c-.33.25-.8.01-.8-.4Zm11.96-4.45c.58 6.26-4.64 11.48-10.9 10.9 -4.43-.41-8.12-3.85-8.9-8.23 -.26-1.42-.19-2.78.12-4.04 .14-.58.76-.9 1.31-.7v0c.47.17.75.67.63 1.16 -.2.82-.27 1.7-.19 2.61 .37 4.04 3.89 7.25 7.95 7.26 4.79.01 8.61-4.21 7.94-9.12 -.51-3.7-3.66-6.62-7.39-6.86 -.83-.06-1.63.02-2.38.2 -.49.11-.99-.16-1.16-.64v0c-.2-.56.12-1.17.69-1.31 1.79-.43 3.75-.41 5.78.37 3.56 1.35 6.15 4.62 6.5 8.4ZM5.5 4C4.67 4 4 4.67 4 5.5 4 6.33 4.67 7 5.5 7 6.33 7 7 6.33 7 5.5 7 4.67 6.33 4 5.5 4Z"
            ></path>
          </svg>
          <div class="tracking-wide dark:text-white flex-1">
            MovieShare<span class="text-red-600">.</span>
          </div>
        </header>

        <section>
          <div class="flex flex-col justify-between mt-4 bg-black/10 bg-blend-multiply rounded-3xl h-70 overflow-hidden bg-cover bg-center px-7 pt-4 pb-6 text-white" style="background-image: url(&quot;/public/imgs/movies.jpg&quot;)">
            <div class="flex -space-x-1 items-center"></div>

            <div class="bg-gradient-to-r from-black/30 to-transparent -mx-7 -mb-6 px-7 pb-6 pt-2">
              <span class="uppercase text-3xl font-semibold drop-shadow-lg">Accédez au catalogue pour voir un film</span>
              <div class="mt-4 flex space-x-3 items-center">
                <a href="movies.html" class="start_streaming_btn">Commencer le streaming</a>
              </div>
            </div>
          </div>
          <div class="scraper_results">
          <h1 class="moviesText">Films du moment</h1>
          <div id="movies" class="movies-grid"></div>
          <script>
              fetch('/public/json/popular_movies.json')
                  .then(response => response.json())
                  .then(data => {
                      const moviesContainer = document.getElementById('movies');
                      data.results.forEach(movie => {
                          const movieElement = document.createElement('a');
                          movieElement.style = "color: #fff";
                          movieElement.className = 'movie';
                          movieElement.href = movie.url;
                          movieElement.target = '_blank';
                          movieElement.innerHTML = `
                              <img src="${movie.poster}" alt="${movie.name}" width="100">
                              <div class="movie-info">
                                    <span style="font-size: 1.2em;">${movie.name}</span>
                                  <span>Année: ${movie.year}</span>
                              </div>
                          `;
                          moviesContainer.appendChild(movieElement);
                      });
                  })
                  .catch(error => console.error('Error loading JSON:', error));
          </script>
          <button id="refresh-scraper" class="refresh-scraper-btn">Rafraîchir le scraping</button>
          </div>
          <script>
              document.getElementById('refresh-scraper').addEventListener('click', () => {
                  fetch('/scraper', { method: 'POST' })
                      .then(response => {
                          if (response.ok) {
                              alert('Scraping rafraîchi avec succès!');
                              location.reload();
                          } else {
                              alert('Erreur lors du rafraîchissement du scraping.');
                          }
                      })
                      .catch(error => console.error('Error:', error));
              });
          </script>
        </section>
      </main>
    </div>
  </body>
</html>
