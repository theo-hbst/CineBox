<!doctype html>
<html lang="en">
  <head>
    <title>Logged out</title>
    <link rel="stylesheet" href="/public/css/fonts.css" type="text/css" media="all" />
    <link rel="stylesheet" href="/public/css/login.css" type="text/css" media="all" />

    <link rel="shortcut icon" href="/public/imgs/icon.ico" />
    <link rel="apple-touch-icon" href="/public/imgs/icon.ico" />

    <meta name="viewport" content="initial-scale=1" />
    <meta charset="utf-8" />
  </head>

  <body>
    <script>
      fetch('/api/config')
        .then((res) => res.json())
        .then((config) => {
          if (config.noid) {
            window.location.href = '/public/pages/content/home.html';
            return;
          }

          localStorage.removeItem('username');
          setTimeout(() => {
            window.location.href = '/';
          }, 5000);
        })
        .catch(() => {
          localStorage.removeItem('username');
          setTimeout(() => {
            window.location.href = '/';
          }, 5000);
        });
    </script>

    <h1>Logged out</h1>
    <p>You have been successfully logged out!</p>
    <p class="redirect-message">You will be redirected to the home page in a few seconds...</p>
  </body>
</html>
