<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMDb Moviemeter Demo</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Standalone demo</p>
        <h1>IMDb moviemeter scraper</h1>
        <p class="lede">Un serveur Python simple récupère les films populaires IMDb côté serveur, puis cette page les affiche en grille.</p>
      </div>
      <div class="actions">
        <button id="refreshButton" type="button">Rafraîchir le scraping</button>
        <a href="/popular_movies.json" target="_blank" rel="noreferrer">Voir le JSON</a>
      </div>
    </header>

    <section class="status-bar">
      <span id="statusText">Chargement...</span>
      <span id="countText"></span>
    </section>

    <section id="movies" class="movies-grid"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
