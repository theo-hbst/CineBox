<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="file-manager">
        <div id="back-button-container" style="position: absolute; top: 10px; left: 10px;">
            <button id="back-button" style="display: none;">Retour</button>
        </div>
        <!-- Files and folders will be displayed here -->
    </div>
    <div id="current-path" style="position: absolute; bottom: 10px; right: 10px;">
        <!-- The current path will be displayed here -->
    </div>
    <script src="script.js"></script>
</body>
</html>
